name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        components: rustfmt, clippy
    - run: cargo fmt -- --check
    - run: cargo clippy --all-targets --all-features -- -D warnings

  # Unlike sz-rust-sdk, this crate needs no live Senzing SDK to test -- it's pure FFI declarations
  # + marshaling helpers + a szerrors.json parser, none of which call into libSz at runtime (the
  # `extern "C"` bindings resolve at a CONSUMER's final-link time, not this crate's own build/test).
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: lint
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
    - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
    - run: cargo test
    - run: cargo test --all-features
