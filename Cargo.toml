[package]
name = "sz-rust-sdk-ffi"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["Senzing Community"]
license = "Apache-2.0"
description = "Senzing low-level FFI/marshaling core: C-ABI bindgen bindings + str<->C helpers + error-taxonomy codegen, shared by sz-rust-sdk and Senzing's in-tree Rust binding layer"
keywords = ["senzing", "entity-resolution", "ffi"]
categories = ["api-bindings", "database"]
repository = "https://github.com/brianmacy/sz-rust-sdk-ffi"
homepage = "https://senzing.com"
readme = "README.md"

[lib]
name = "sz_rust_sdk_ffi"
crate-type = ["rlib"]

[dependencies]
libc = "0.2"
hex = "0.4"
serde_json = { version = "1", optional = true }

[features]
default = ["ffi"]
# The bindgen C-ABI bindings + str<->C helpers. Split from `codegen` so a build-dependency
# consumer that only needs error-taxonomy codegen (a build.rs has no business linking FFI
# bindings) can depend with `default-features = false, features = ["codegen"]` and avoid pulling
# in `helpers::sz_free`'s reference to `SzHelper_free` -- on Windows/MSVC, an unreferenced-at
# -runtime extern from a dependency crate is NOT reliably dead-stripped at link time the way it is
# on macOS/Linux, so a codegen-only consumer that accidentally also compiled `ffi`/`helpers` would
# fail to link with an unresolved external, even though nothing in its own code calls it.
ffi = []
codegen = ["dep:serde_json"]

[dev-dependencies]
bindgen = "0.73"
